version: "3.9"

services:
  # ── FastAPI Backend ──────────────────────────────────────────────
  api:
    build: .
    container_name: hitl-api
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    restart: unless-stopped

  # ── Streamlit UI ─────────────────────────────────────────────────
  ui:
    build: .
    container_name: hitl-ui
    command: streamlit run ui/app.py --server.port 8501 --server.address 0.0.0.0 --server.headless true
    ports:
      - "8501:8501"
    env_file:
      - .env
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  # ── Background Scheduler ─────────────────────────────────────────
  scheduler:
    build: .
    container_name: hitl-scheduler
    command: python -m app.jobs.daily_job_fetcher
    env_file:
      - .env
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
